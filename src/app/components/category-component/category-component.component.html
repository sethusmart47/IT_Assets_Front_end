<div class="clr-row">
  <div class="clr-col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Asset Categories</span>
        <button class="btn btn-primary btn-sm" (click)="openAdd()">
          <cds-icon shape="plus"></cds-icon> Add Category
        </button>
      </div>
      <div class="card-block">
        <app-reusable-datagrid
          [columns]="columns"
          [data]="categories"
          [loading]="loading"
          (onEdit)="openEdit($event)"
          (onDelete)="openDelete($event)">
        </app-reusable-datagrid>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<clr-modal [(clrModalOpen)]="isModalOpen" [clrModalClosable]="!saving">
  <h3 class="modal-title">{{ modalTitle }}</h3>
  <div class="modal-body">
    <form [formGroup]="form" clrForm clrLayout="vertical">

      <clr-input-container>
        <label>Category Name *</label>
        <input clrInput formControlName="categoryName" placeholder="Enter category name" />
        <clr-control-error *clrIfError="'required'">Category name is required.</clr-control-error>
        <clr-control-error *clrIfError="'maxlength'">Max 100 characters allowed.</clr-control-error>
      </clr-input-container>

      <clr-toggle-container *ngIf="isEditMode">
        <label>Status</label>
        <clr-toggle-wrapper>
          <input type="checkbox" clrToggle formControlName="isActive" />
          <label>{{ form.value.isActive ? 'Active' : 'Inactive' }}</label>
        </clr-toggle-wrapper>
      </clr-toggle-container>

    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="closeModal()" [disabled]="saving">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving || form.invalid">
      <span *ngIf="saving" class="spinner spinner-inline spinner-sm"></span>
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>
  </div>
</clr-modal>

<!-- DELETE CONFIRM -->
<app-confirm-dialog
  [isOpen]="isDeleteOpen"
  [loading]="deleting"
  [message]="'Are you sure you want to delete category: ' + deleteItem?.categoryName + '?'"
  (onConfirm)="confirmDelete()"
  (onCancel)="cancelDelete()">
</app-confirm-dialog>
