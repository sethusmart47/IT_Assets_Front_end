<clr-modal [(clrModalOpen)]="isOpen" [clrModalClosable]="!loading" [clrModalSize]="'sm'">
  <h3 class="modal-title">{{ title }}</h3>
  <div class="modal-body">
    <p>{{ message }}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="cancel()" [disabled]="loading">Cancel</button>
    <button type="button" class="btn btn-danger" (click)="confirm()" [disabled]="loading">
      <span *ngIf="loading" class="spinner spinner-inline spinner-sm"></span>
      Delete
    </button>
  </div>
</clr-modal>
