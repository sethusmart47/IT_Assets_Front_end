<div class="master-page">
  <div class="page-header">
    <h2>
      <cds-icon shape="layers" size="24"></cds-icon>
      Asset Models
    </h2>
    <div class="header-actions">
      <button class="btn btn-primary" (click)="openAdd()">
        <cds-icon shape="plus"></cds-icon> Add Model
      </button>
    </div>
  </div>

  <div class="detail-section">
    <app-reusable-datagrid
      [columns]="columns"
      [data]="models"
      [loading]="loading"
      (onEdit)="openEdit($event)"
      (onDelete)="openDelete($event)">
    </app-reusable-datagrid>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<clr-modal [(clrModalOpen)]="isModalOpen" [clrModalClosable]="!saving" [clrModalSize]="'lg'">
  <h3 class="modal-title">{{ modalTitle }}</h3>
  <div class="modal-body">
    <form [formGroup]="form" clrForm clrLayout="vertical">

      <clr-select-container>
        <label>Category <span class="required">*</span></label>
        <select clrSelect formControlName="assetCategoryId">
          <option value="">-- Select Category --</option>
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.categoryName }}</option>
        </select>
        <clr-control-error *clrIfError="'required'">Category is required.</clr-control-error>
      </clr-select-container>

      <clr-select-container>
        <label>Brand <span class="required">*</span></label>
        <select clrSelect formControlName="assetBrandId">
          <option value="">-- Select Brand --</option>
          <option *ngFor="let brand of filteredBrands" [value]="brand.id">{{ brand.brandName }}</option>
        </select>
        <clr-control-error *clrIfError="'required'">Brand is required.</clr-control-error>
        <clr-control-helper *ngIf="filteredBrands.length === 0 && form.value.assetCategoryId">
          No brands available for selected category.
        </clr-control-helper>
      </clr-select-container>

      <clr-input-container>
        <label>Model Name <span class="required">*</span></label>
        <input clrInput formControlName="modelName" placeholder="Enter model name" />
        <clr-control-error *clrIfError="'required'">Model name is required.</clr-control-error>
        <clr-control-error *clrIfError="'maxlength'">Max 150 characters allowed.</clr-control-error>
      </clr-input-container>

      <clr-toggle-container *ngIf="isEditMode">
        <label>Status</label>
        <clr-toggle-wrapper>
          <input type="checkbox" clrToggle formControlName="isActive" />
          <label>{{ form.value.isActive ? 'Active' : 'Inactive' }}</label>
        </clr-toggle-wrapper>
      </clr-toggle-container>

    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline" (click)="closeModal()" [disabled]="saving">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="saving || form.invalid">
      <span *ngIf="saving" class="spinner spinner-inline spinner-sm"></span>
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>
  </div>
</clr-modal>
